<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="side-bar">
        <div class="logo">
            <img src="./odin-lined.png">
            <p>Sakshesh-Code</p>
        </div>
        <p>
            Photo by <a href="https://unsplash.com/@johnygoerend">Johny Goerend</a>
            on <a href="https://unsplash.com">Unsplash</a>
        </p>
    </div>
    <section class="main">
        <div>
            <p>
            This is my first time making an online form! 
            </p>
            <p>This is not a real website but Hey! Sign Up now to get started.</p>
            <br>
            <p><small>-Sakshesh-code</small></p>
        </div>

        <div class="form">
        <form action="" method="get">
        <fieldset>
            <h3>Sign up for Free</h3>
            <ul>
                <li>
                    <div class="form-row">
                    <label for="fname">
                        First Name
                    </label>
                        <input type="text" id="fname" name="first-name" required>
                    </div>

                    <div class="form-row">
                        <label for="lname">
                            Last Name 
                        </label>
                        <input type="text" id="lname" name="last-name" required>
                    </div>
                </li>
                    

                <li>
                    <div class="form-row">
                        <label for="email">
                            Email 
                        </label>
                        <input type="email" id="email" name="user_email" required>
                    </div>

                    <div class="form-row">
                        <label for="pnum">
                            Phone Number 
                        </label>
                        <input type="tel" id="pnum" name="phone_number">
                    </div>
                </li>


                <li>
                    <div class="form-row">
                        <label for="pwd">
                            Password 
                        </label>
                        <input type="password" id="pwd" name="password" required>
                    </div>

                    <div class="form-row">
                        <label for="cpwd">
                            Confirm Password
                        </label>
                        <input type="password" id="cpwd" name="confirm-pwd" required>
                    </div>
                </li>
            </ul>
            
        </fieldset>
        <div><button type="submit">Create Account</button></div>
    </form>
    <p><small>Already have an account? <a href="">Log in</a></small></p>
    </div>
    </section>
</body>
</html>
